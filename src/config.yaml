---
# https://github.com/feng2208/github-hosts
# ============================================================================
# 本地加固版配置 —— 目标：不依赖本机 DNS、Web/CLI 稳定可用
# ============================================================================
#
# 设计原则：**完全不依赖本机 DNS 解析**
#   所有映射都写死 GitHub 官方 IP 地址，代理连接时不再查询 octocaptcha.com /
#   yelp.com 等前置域名（这些域名的解析可能不可用或漂移，是"时好时坏"的根因）。
#
# 两种 TLS 处理方式（脚本内置支持）：
#   1) sni 以下划线开头 = **握手时不发送 SNI**（如 `_github.com`）
#      部分网络下明文 SNI 会导致连接被重置；不发送 SNI 即可规避该问题，
#      服务端只认 HTTP 的 Host 头，因此路由依然正确。
#      下划线后面跟的是"用哪个域名校验服务端证书"，必须是该 IP 证书 SAN
#      里真实存在的名字（含通配符）。
#   2) sni 为正常域名 = **SNI 对齐**（当目标 IP 的证书与访问域名不一致时，
#      改用该证书真实包含的域名作为 SNI，Host 保持不变）。
#      本配置仅在必要时使用。
#
# 证书事实（实测取证，2026-09-17）：
#   140.82.116.3  → CN=github.com        SAN: github.com, www.github.com
#   140.82.112.6  → CN=*.github.com      SAN: *.github.com, github.com
#   140.82.112.9  → CN=*.github.com      SAN: *.github.com, github.com
#   140.82.112.4  → CN=github.com        SAN: github.com, www.github.com
#   185.199.111.133 → CN=*.github.io     SAN: *.github.com, *.github.io,
#                                            *.githubusercontent.com, github.com,
#                                            github.io, githubusercontent.com
#   185.199.111.154 → CN=*.githubassets.com
#   185.199.111.153 → CN=*.github.io (GitHub Pages)
#
# 网络事实（实测取证，2026-09-17）：
#   · 部分网络环境下，github.com / api.github.com / codeload.github.com /
#     gist.github.com 的连接在 TLS 握手阶段会被中断（TCP 可连）
#   · 185.199.108.133 在部分网络下 TCP 超时不可达；
#     185.199.109/110/111.133 可达 —— 故主用 .111，备份 .109/.110
#   · 其余域名统一走"固定 IP"，避免受本机 DNS 解析结果影响
# ============================================================================

mappings:
# ---------------------------------------------------------------------------
# 1. 主站 github.com —— 省略 SNI + 固定 IP
# ---------------------------------------------------------------------------
- hosts:
    - github.com
  sni: _github.com
  address: 140.82.116.3:443

# ---------------------------------------------------------------------------
# 2. 其余 *.github.com 子域兜底（uploads / alive / collector / raw.github.com…）
#    显式映射优先级更高，所以 api/codeload/gist 不受此条影响
# ---------------------------------------------------------------------------
- hosts:
    - "*.github.com"
  sni: _github.com
  address: 140.82.116.3:443

# ---------------------------------------------------------------------------
# 3. REST API（搜索、仓库详情、Release、RateLimit…）—— 省略 SNI
# ---------------------------------------------------------------------------
- hosts:
    - api.github.com
  sni: _api.github.com
  address: 140.82.112.6:443

# ---------------------------------------------------------------------------
# 4. 仓库打包下载（zip / tar.gz）—— 省略 SNI
# ---------------------------------------------------------------------------
- hosts:
    - codeload.github.com
  sni: _codeload.github.com
  address: 140.82.112.9:443

# ---------------------------------------------------------------------------
# 5. Gist —— 该 IP 证书 SAN 只有 github.com / www.github.com，
#    故用 `_github.com` 校验（不要写成 _gist.github.com，那样校验会失败）
# ---------------------------------------------------------------------------
- hosts:
    - gist.github.com
  sni: _github.com
  address: 140.82.112.4:443

# ---------------------------------------------------------------------------
# 6. 静态资源（网页样式/脚本/图标，缺了网页会花屏）
# ---------------------------------------------------------------------------
- hosts:
    - github.githubassets.com
  sni: _github.githubassets.com
  address: 185.199.111.154:443

# ---------------------------------------------------------------------------
# 7. 用户内容 CDN —— raw / avatars / objects(Release 附件) / camo / media /
#    gist.githubusercontent.com / user-images … 全部由 *.githubusercontent.com 覆盖
#
#    2026-09-17 晚实测：GitHub 自有 CDN 段 185.199.108~111.**.133 / .153 在部分
#      网络下整段不可达；Fastly 151.101.x.133 亦不可用。
#      仅 **185.199.111.154**（assets IP）可达。
#    但 .154 的默认证书是 *.githubassets.com —— 直接连它会「主机名不匹配」，
#      发送 SNI `raw.githubusercontent.com` 也不可用。可行解 = **SNI 对齐**：
#        · SNI 用 `github.githubassets.com`（该 IP 证书 SAN 里真实存在，校验通过）
#        · HTTP Host 保持原样（raw / avatars / objects …）→ CDN 按 Host 头返回正确内容
#      实测：raw 200 + 头像 200（curl 验证）。
#      备份候选（若 .154 也不可达）：185.199.110.154 / .109.154 / .108.154
# ---------------------------------------------------------------------------
- hosts:
    - "*.githubusercontent.com"
  sni: github.githubassets.com
  address: 185.199.111.154:443

# ---------------------------------------------------------------------------
# 8. GitHub Pages 站点（*.github.io）
# ---------------------------------------------------------------------------
- hosts:
    - "*.github.io"
  sni: _github.io
  address: 185.199.111.153:443
